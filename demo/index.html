<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Slot picker demo</title>
  <!-- Built artifacts: run `bun run build` first, then open this file
       directly (no web server required) or serve it with `bun run dev`. -->
  <link rel="stylesheet" href="../dist/slot-picker.css">
  <link rel="stylesheet" href="./themes/compact.css">
  <link rel="stylesheet" href="./themes/cards.css">
  <link rel="stylesheet" href="./themes/outlined.css">
  <style>
    body { max-width: 64rem; margin: 3rem auto; padding: 0 1rem; font-family: system-ui, sans-serif; }
    .card { border: 1px solid #ddd; border-radius: 0.75rem; padding: 1.5rem; margin-block-end: 2rem; }
    .row { display: flex; gap: 1rem; align-items: center; margin-block-end: 1rem; }
    .compare { display: flex; flex-wrap: wrap; gap: 2rem; align-items: start; }
    .phone { flex: 1 1 20rem; max-width: 23rem; border: 2px solid #1f2328; border-radius: 1.75rem; padding: 1rem 0.75rem; }
    .phone h3 { margin-block: 0 1rem; font-size: 1rem; text-align: center; }
    .build-warning { display: none; border: 1px solid #b91c1c; border-radius: 0.5rem; padding: 1rem; margin-block-end: 2rem; }
    .build-warning code { font-family: ui-monospace, monospace; }
  </style>
</head>
<body>
  <h1>Slot picker</h1>
  <p class="build-warning" id="build-warning">Le composant n'est pas chargé. Lancez <code>bun run build</code>, puis rechargez cette page.</p>
  <div class="row">
    <label for="theme">Thème columns</label>
    <select id="theme">
      <option value="">Défaut</option>
      <option value="compact">compact</option>
      <option value="cards">cards</option>
      <option value="outlined">outlined</option>
    </select>
  </div>
  <div class="card">
    <h2>Columns</h2>
    <slot-picker id="picker-columns" start="2026-11-17" day-count="5" max-visible-rows="5"></slot-picker>
  </div>
  <div class="card">
    <h2>Day</h2>
    <slot-picker id="picker-day" start="2026-11-17" day-count="5" layout="day"></slot-picker>
  </div>
  <div class="card">
    <h2>Conteneurs étroits</h2>
    <div class="compare">
      <div class="phone">
        <h3>Columns · 3 jours</h3>
        <slot-picker id="picker-columns-narrow" start="2026-11-17" day-count="3" max-visible-rows="5"></slot-picker>
      </div>
      <div class="phone">
        <h3>Day · 3 jours</h3>
        <slot-picker id="picker-day-narrow" start="2026-11-17" day-count="3" layout="day"></slot-picker>
      </div>
    </div>
  </div>
  <p id="output"></p>
  <script src="../dist/slot-picker.js"></script>
  <script>
    if (!customElements.get("slot-picker")) {
      document.querySelector("#build-warning").style.display = "block";
    }

    const fr = {
      previous: "Jours précédents",
      next: "Jours suivants",
      showMore: "Voir plus de disponibilités",
      showLess: "Voir moins",
      unavailable: "Indisponible",
      loading: "Chargement des disponibilités",
      empty: "Aucune disponibilité",
      oneSlot: "1 créneau",
      manySlots: "{n} créneaux",
      days: "Jours"
    };

    const days = [
      { date: "2026-11-17", slots: [{ start: "13:35" }, { start: "19:00" }, { start: "21:00" }] },
      { date: "2026-11-18", slots: [{ start: "08:00" }, { start: "08:35" }, { start: "09:00" }, { start: "10:10" }, { start: "11:40" }, { start: "12:00" }, { start: "14:30" }, { start: "15:20" }, { start: "19:00" }, { start: "21:30" }] },
      { date: "2026-11-19", slots: [{ start: "09:15" }, { start: "11:35" }, { start: "12:20" }, { start: "14:10" }, { start: "18:00" }, { start: "19:00" }] },
      { date: "2026-11-20", slots: [{ start: "12:00" }, { start: "15:30" }, { start: "16:45" }, { start: "19:00" }, { start: "20:20" }, { start: "21:00" }, { start: "21:40" }] },
      {
        date: "2026-11-21",
        slots: [],
        notice: {
          label: "Indisponibilité exceptionnelle",
          description: "Le praticien est exceptionnellement indisponible ce jour. Merci de votre compréhension."
        }
      }
    ];

    const pickers = [
      document.querySelector("#picker-columns"),
      document.querySelector("#picker-day"),
      document.querySelector("#picker-columns-narrow"),
      document.querySelector("#picker-day-narrow")
    ];
    pickers.forEach((picker) => {
      picker.messages = fr;
      picker.days = days;
    });

    const columnsPickers = [
      document.querySelector("#picker-columns"),
      document.querySelector("#picker-columns-narrow")
    ];

    const output = document.querySelector("#output");
    pickers.forEach((picker) => {
      picker.addEventListener("slotactivate", (event) => {
        output.textContent = `Selected: ${event.detail.value}`;
      });
      picker.addEventListener("daychange", (event) => {
        output.textContent = `Active day: ${event.detail.activeDate}`;
      });
      picker.addEventListener("noticeactivate", (event) => {
        output.textContent = event.detail.notice.description;
      });
    });

    document.querySelector("#theme").addEventListener("change", (event) => {
      const theme = event.target.value;
      columnsPickers.forEach((picker) => {
        if (theme) picker.setAttribute("data-theme", theme);
        else picker.removeAttribute("data-theme");
      });
    });
  </script>
</body>
</html>
